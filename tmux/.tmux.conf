###################################################################################
# Terminal & Prefix
###################################################################################
set -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Use Ctrl + a as prefix instead of Ctrl + b
set -g prefix C-a
bind C-a send-prefix
unbind C-b

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf\; display "Reloaded!"

# Session management using tmux's built-in chooser
bind s choose-session
bind w choose-tree -Zw

# Split panes and window behavior
bind-key '%' split-window -h -p 40
set -g base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 0
set -g status-right ""

###################################################################################
# Theme: Catppuccin (Dynamic)
###################################################################################
# Catppuccin flavor options: latte, frappe, macchiato, mocha
# Read theme from ~/.config/theme file, default to mocha
run-shell 'tmux set -g @catppuccin_flavor "$(cat ~/.config/theme 2>/dev/null || echo mocha)"'

# Window styling
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Status bar customization
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
set -g status-left-length 30
set -g status-justify centre
set -g status-position top
set -g window-status-separator " "

###################################################################################
# Plugins (via TPM)
###################################################################################
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Navigation integration with Vim
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
