###################################################################################
# Terminal & Prefix
###################################################################################
set -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s set-clipboard on

# Use Ctrl + a as prefix instead of Ctrl + b
set -g prefix C-a
bind C-a send-prefix
unbind C-b

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf\; display "Reloaded!"

# Session management using tmux's built-in chooser
bind s choose-session
bind f popup -w 100% -h 40% -x C -y 9999 -E "TMUX_SESSIONIZER_SWITCH_ONLY=true $HOME/.dotfiles/tmux/.config/tmux/tmux-sessionizer.sh"
bind F popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.dotfiles/tmux/.config/tmux/tmux-sessionizer.sh"
bind a popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.dotfiles/tmux/.config/tmux/tmux-codex-agents.sh"
bind w popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.dotfiles/tmux/.config/tmux/tmux-worktree.sh"
bind W popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.dotfiles/tmux/.config/tmux/tmux-worktree-delete.sh"
bind m set -g mouse \; display-message "tmux mouse #{?mouse,on,off}"

# Split panes and window behavior
bind-key '%' split-window -h -p 40
bind c new-window -c "#{pane_current_path}"
set -g base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 0
set -g status-right ""
set -g mode-keys vi

###################################################################################
# Theme: Dracula
###################################################################################
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-battery false
set -g @dracula-show-network false
set -g @dracula-show-weather false
set -g @dracula-plugins "time"
set -g @dracula-time-format "%R"

# Status bar customization
set -g status-left "#S"
set -g status-right ""
set -g status-left-length 30
set -g status-justify centre
set -g status-position top
set -g window-status-separator " "

###################################################################################
# Plugins (via TPM)
###################################################################################
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Navigation integration with Vim
set -g @plugin 'christoomey/vim-tmux-navigator'

# Dracula theme
set -g @plugin 'dracula/tmux'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
