###################################################################################
# Terminal & Prefix
###################################################################################
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Use Ctrl + a as prefix instead of Ctrl + b
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf\; display "Reloaded!"

# Split panes and window behavior
bind-key '%' split-window -h -p 40
set -g base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 0
set -g status-right ""

###################################################################################
# Theme: Catppuccin (Macchiato)
###################################################################################
# Catppuccin flavor options: latte, frappe, macchiato, mocha
set -g @catppuccin_flavor "macchiato"

# Window styling
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Status bar customization
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#[fg=#24273a,bg=#ed8796,bold]   🖥️  VM   "
set -g status-left-length 30
set -g status-right-length 30
set -g status-justify centre
set -g status-position top
set -g window-status-separator " "


###################################################################################
# Sesh - Smart Session Manager
###################################################################################
bind s display-popup -E -w 60% -h 60% "bash -c 'session=\$(sesh list --tmux | fzf --height 100% --reverse --border-label \" sesh \" --border --prompt \"⚡ \" --pointer \"▶\" --bind \"tab:down,shift-tab:up,ctrl-j:down,ctrl-k:up,ctrl-x:execute-silent(tmux kill-session -t {})+reload(sesh list --tmux)\" | tr -d \"[:space:]\"); [ -n \"\$session\" ] && tmux switch-client -t \"\$session\"'"
bind w choose-tree -Zw

###################################################################################
# Plugins (via TPM)
###################################################################################
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Navigation integration with Vim
set -g @plugin 'christoomey/vim-tmux-navigator'

# Battery indicator
set -g @plugin 'tmux-plugins/tmux-battery'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

