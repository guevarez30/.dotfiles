###################################################################################
# Terminal & Prefix
###################################################################################
set -g default-shell /bin/zsh
set -s default-terminal "tmux-256color"
set -s terminal-overrides "xterm-256color:RGB,tmux-256color:RGB,ghostty:RGB"
set -s terminal-features "xterm-256color:RGB,tmux-256color:RGB,ghostty:RGB"

set-environment -g COLORTERM truecolor
set -g mouse off
set -g @dracula-transparent-powerline-bg true
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard,tmux-256color:clipboard,ghostty:clipboard,xterm-ghostty:clipboard"

# Use Ctrl + a as prefix instead of Ctrl + b
set -g prefix C-a
bind C-a send-prefix
unbind C-b
bind m set -g mouse \; display-message "tmux mouse #{?mouse,on,off}"

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf\; display "Reloaded!"

bind s choose-session
bind w choose-tree -Zw

# Split panes and window behavior
bind-key '%' split-window -h -p 40
set -g base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 0
set -g status-right ""

###################################################################################
# Theme: Dracula
###################################################################################
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-battery false
set -g @dracula-show-network false
set -g @dracula-show-weather false
set -g @dracula-plugins "time"
set -g @dracula-time-format "%R"

# Clear stale style options from previously sourced themes.
set -g window-style default
set -g window-active-style default
set -g pane-border-style default
set -g pane-active-border-style default
set -g mode-style "fg=#f8f8f2,bg=#44475a,bold"
set -g message-style default
set -g message-command-style default
set -g status-style default

# Status bar customization
set -g status-left "#S"
set -g status-right ""
set -g status-left-length 30
set -g status-justify centre
set -g status-position top
set -g window-status-separator " "

###################################################################################
# Plugins (via TPM)
###################################################################################
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Navigation integration with Vim
set -g @plugin 'christoomey/vim-tmux-navigator'

# Dracula theme
set -g @plugin 'dracula/tmux'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
