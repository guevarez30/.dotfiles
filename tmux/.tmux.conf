###################################################################################
# Terminal & Prefix
###################################################################################
set -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"
set -g terminal-overrides "xterm-256color:RGB"
set -g mouse off
set -s set-clipboard off

# Use Ctrl + a as prefix instead of Ctrl + b
set -g prefix C-a
bind C-a send-prefix
unbind C-b
bind m set -g mouse \; display-message "tmux mouse #{?mouse,on,off}"

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf\; display "Reloaded!"

bind s choose-tree -sZ
bind w choose-tree -Zw

# Split panes and window behavior
bind-key '%' split-window -h -p 40
set -g base-index 1
set -g renumber-windows on
set -g focus-events off
# Give tmux enough time to recognize multi-byte escape sequences such as
# bracketed paste terminators before forwarding stray characters to zsh.
set -sg escape-time 10
set -g status-right ""

###################################################################################
# Theme: Dracula+
###################################################################################
set -g status-style "fg=#f8f8f2,bg=#212121"
set -g message-style "fg=#f8f8f2,bg=#21222c"
set -g message-command-style "fg=#f8f8f2,bg=#21222c"
set -g pane-border-style "fg=#545454"
set -g pane-active-border-style "fg=#c792ea"
set -g mode-style "fg=#212121,bg=#c792ea"

# Status bar customization
set -g status-left "#[fg=#212121,bg=#c792ea,bold] #S #[fg=#c792ea,bg=#212121,nobold]"
set -g status-left-length 30
set -g status-right-length 30
set -g status-justify centre
set -g status-position top
set -g window-status-separator ""
set -g window-status-format "#[fg=#545454,bg=#212121] #I:#W "
set -g window-status-current-format "#[fg=#212121,bg=#ffcb6b,bold] #I:#W "

###################################################################################
# Plugins (via TPM)
###################################################################################
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Navigation integration with Vim
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
